server {
    listen 80;
    server_name routemarket.io www.routemarket.io supabase.routemarket.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name routemarket.io www.routemarket.io;

    ssl_certificate /etc/letsencrypt/live/routemarket.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/routemarket.io/privkey.pem;

    # Naglowki bezpieczenstwa. Swiadomie BEZ "preload": wpis na liste preload
    # przegladarek jest praktycznie nieodwracalny (usuniecie trwa miesiacami),
    # a sam max-age z includeSubDomains daje ta sama ochrone bez zobowiazania.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Trzy adresy obsługuje API, bo wymagają znaczników zależnych od treści.
    # Zwraca ten sam index.html co front, tylko z podmienionym tytułem, opisem
    # i obrazkiem — aplikacja startuje normalnie, a robot i podgląd odnośnika
    # dostają to, co opisuje konkretną tablicę albo miejsce, a nie stronę główną.
    location ^~ /tablica/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /miejsce/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mapa strony budowana z bazy zamiast pliku sprzed pół roku.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8081/sitemap.xml;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /atlas/ {
        proxy_pass http://127.0.0.1:8501/atlas/;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /atlas-api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /route-builder-api/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        # Tura wywiadu to Gemini + geokodowanie kilkunastu nazw + dwa przebiegi
        # routingu; domyślne 60 s ucinało ją jako 504, a użytkownik widział
        # milczącego agenta. Frontend czeka 180 s, proxy musi wytrzymać tyle samo.
        proxy_read_timeout 200;
        proxy_send_timeout 200;
        proxy_connect_timeout 15;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name supabase.routemarket.io;

    ssl_certificate /etc/letsencrypt/live/routemarket.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/routemarket.io/privkey.pem;

    # Naglowki bezpieczenstwa. Swiadomie BEZ "preload": wpis na liste preload
    # przegladarek jest praktycznie nieodwracalny (usuniecie trwa miesiacami),
    # a sam max-age z includeSubDomains daje ta sama ochrone bez zobowiazania.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Kompresja odpowiedzi API. Zmierzone: zapytanie o sto pozycji katalogu
    # z opisami w szesciu jezykach wazy 105 kB, a po gzipie 37,7 kB — 64% mniej.
    # Zasoby statyczne frontu kompresuje juz nginx w swoim kontenerze; API nie
    # kompresowalo nic, a to ono zwraca najwiecej tekstu.
    #
    # gzip_proxied any jest tu konieczne: bez niego nginx pomija odpowiedzi
    # przychodzace z proxy, czyli akurat wszystkie tutaj.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain text/css
               application/xml text/xml image/svg+xml application/geo+json;

    location / {
        # burst pozwala na naturalne serie: wejscie na strone wysyla kilkanascie
        # zapytan naraz i nie moze dostac 429. nodelay przepuszcza je od razu,
        # zamiast rozkladac w czasie i spowalniac zwyklego uzytkownika.
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
